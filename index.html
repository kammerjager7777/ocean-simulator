<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ocean Simulator V31.9</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230c1724'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/ui/ui.css?v=30.29">
  <link rel="stylesheet" href="./src/ui/v23/v23.css?v=33.2">
</head>
<body>
  <canvas id="sea"></canvas>
  <section id="panel" class="glass" aria-label="Ocean controls">
    <header class="ph">
      <div class="ph-text">
        <h1 class="title"><span class="t-full">Ocean Simulator</span><span class="t-short">Ocean</span></h1>
        <div class="subtitle">V31.9 · physical sea</div>
      </div>
      <button id="panel-toggle" class="icon-btn" type="button" aria-expanded="true" aria-controls="panel-body" aria-label="Minimise controls">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <div id="panel-body">
      <!-- v30.23: the values are set on the block (sock, tape, gauge, paddle, Secchi); these stay as the one
           source of truth and the keyboard fallback (visually hidden, Tab-reachable role=slider) -->
      <div class="v23-fallback">
        <input id="dir" class="vh kb" type="range" min="0" max="359" value="90" aria-label="Wind direction (degrees)">
        <input id="spd" class="vh kb" type="range" min="0" max="25" step="0.5" value="12" aria-label="Wind speed (m/s)">
        <input id="chop" class="vh kb" type="range" min="0" max="2.5" step="0.1" value="1.5" aria-label="Choppiness">
        <input id="age" class="vh kb" type="range" min="0" max="1" step="0.01" value="0.28" aria-label="Sea age, young to old swell">
        <input id="cur" class="vh kb" type="range" min="-3" max="3" step="0.1" value="0" aria-label="Current along the wind, negative is opposing">
        <input id="size" class="vh kb" type="range" min="100" max="1000" step="10" value="250" aria-label="Size (m)">
        <input id="clarity" class="vh kb" type="range" min="3" max="40" step="any" value="22.3024" aria-label="Visibility, Secchi depth in metres">
        <input id="depth" class="vh kb" type="range" min="2" max="80" step="1" value="40" aria-label="Depth (m)">
        <select id="gust" class="vh" tabindex="-1" aria-hidden="true"><option value="continuous" selected>Continuous</option><option value="gusty">Gusty</option></select>
        <span id="dir-val" class="vh"></span><span id="spd-val" class="vh"></span><span id="chop-val" class="vh"></span><span id="size-val" class="vh"></span><span id="clarity-val" class="vh"></span><span id="depth-val" class="vh"></span>
      </div>
      <label class="srow" for="boat"><span class="lbl">Boat</span><input id="boat" class="sw" type="checkbox" role="switch" checked></label>
      <label class="srow" for="flags"><span class="lbl">Break flags</span><input id="flags" class="sw" type="checkbox" role="switch"></label>
      <label class="srow" for="pause"><span class="lbl">Pause</span><span class="mono key">Space</span><input id="pause" class="sw" type="checkbox" role="switch"></label>
    </div>
  </section>
  <section id="strip" class="glass" aria-label="Sea stats">
    <div class="srowline mono">
      <span><b id="st-fps">--</b> FPS</span>
      <span class="dk">MED <b id="st-med">--</b> ms</span>
      <span class="dk">P99 <b id="st-p99">--</b> ms</span>
      <span>WIND <b id="st-wind">--</b> m/s</span>
      <span class="dk">SEA STATE <b id="st-sea">--</b></span>
      <span>FOAM SEA <b id="st-foam">--</b>%</span>
      <button id="strip-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="strip-more" aria-label="Expand stats">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div id="strip-more">
      <div class="more-grid mono">
        <span>Hs <b id="st-hs">--</b> m</span><span>PEAK λ ≈<b id="st-lam">--</b> m</span><span>PEAK T ≈<b id="st-tp">--</b> s</span><span>DEPTH <b id="st-depth">--</b> m</span>
        <span>SWELL <b id="st-swell">--</b> m</span><span>WIND SEA <b id="st-windsea">--</b> m</span><span>CHOP <b id="st-chop">--</b> m</span><span>FINE <b id="st-fine">--</b> m</span>
        <span>FINER <b id="st-finer">--</b> m</span><span>BREAKING <b id="st-brk">--</b></span><span>FOAMED <b id="st-foamed">--</b></span><span>HELD <b id="st-held">0</b></span>
      </div>
      <canvas id="spark" width="240" height="48" aria-label="Frame time graph"></canvas>
    </div>
    <!-- v29 text readouts: still written by main.js, not shown (GAD: strip shows numbers only) -->
    <div class="vh" aria-hidden="true"><p id="bands"></p><p id="readout"></p><p id="gravity"></p><p id="clock"></p><p id="camera"></p></div>
  </section>
  <script type="module" src="./src/main.js?v=32.9"></script>
  <script type="module" src="./src/ui/ui.js?v=30.29"></script>
  <script type="module" src="./src/ui/v23/index.js?v=33.3"></script>
</body>
</html>
